<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="45%" stop-color="#0c1222" />
      <stop offset="85%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <radialGradient id="glow-purple" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-cyan" cx="80%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-emerald" cx="50%" cy="90%" r="45%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <!-- Text Gradients -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#a5b4fc" />
      <stop offset="75%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.05" />
    </linearGradient>

    <!-- Filters -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.65" />
    </filter>

    <style>
      /* Dynamic Animations */
      @keyframes pulse-ring {
        0% { transform: scale(0.85); opacity: 0.2; }
        50% { transform: scale(1.15); opacity: 0.6; }
        100% { transform: scale(0.85); opacity: 0.2; }
      }
      @keyframes float-slow {
        0% { transform: translateY(0px) translateX(0px); }
        50% { transform: translateY(-10px) translateX(6px); }
        100% { transform: translateY(0px) translateX(0px); }
      }
      @keyframes float-reverse {
        0% { transform: translateY(0px) translateX(0px); }
        50% { transform: translateY(12px) translateX(-8px); }
        100% { transform: translateY(0px) translateX(0px); }
      }
      @keyframes flow-line {
        0% { stroke-dashoffset: 120; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes node-blink {
        0%, 100% { opacity: 0.4; r: 3.5; }
        50% { opacity: 1; r: 5.5; }
      }
      @keyframes radar-sweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .pulse-1 { transform-origin: 220px 180px; animation: pulse-ring 6s ease-in-out infinite; }
      .pulse-2 { transform-origin: 980px 190px; animation: pulse-ring 8s ease-in-out infinite 2s; }
      .float-group-1 { animation: float-slow 7s ease-in-out infinite; }
      .float-group-2 { animation: float-reverse 9s ease-in-out infinite 1s; }
      .anim-flow { stroke-dasharray: 8 6; animation: flow-line 20s linear infinite; }
      .node-p1 { animation: node-blink 4s ease-in-out infinite; }
      .node-p2 { animation: node-blink 5s ease-in-out infinite 1.5s; }
      .node-p3 { animation: node-blink 3.5s ease-in-out infinite 2.5s; }
      .sweep-arm { transform-origin: 980px 190px; animation: radar-sweep 12s linear infinite; }
      
      .pill-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.6px; fill: #cbd5e1; }
      .main-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif; font-weight: 900; letter-spacing: -0.5px; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif; font-weight: 400; letter-spacing: 0.2px; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="380" fill="url(#bg-grad)" rx="16" />

  <!-- Ambient Light Orbs -->
  <rect width="1200" height="380" fill="url(#glow-purple)" rx="16" />
  <rect width="1200" height="380" fill="url(#glow-cyan)" rx="16" />
  <rect width="1200" height="380" fill="url(#glow-emerald)" rx="16" />

  <!-- Background Grid Lines (Subtle Vector Space Projection) -->
  <g opacity="0.12" stroke="#60a5fa" stroke-width="0.8">
    <line x1="0" y1="70" x2="1200" y2="70" stroke-dasharray="4 6" />
    <line x1="0" y1="140" x2="1200" y2="140" stroke-dasharray="4 6" />
    <line x1="0" y1="210" x2="1200" y2="210" stroke-dasharray="4 6" />
    <line x1="0" y1="280" x2="1200" y2="280" stroke-dasharray="4 6" />
    <line x1="0" y1="350" x2="1200" y2="350" stroke-dasharray="4 6" />

    <line x1="150" y1="0" x2="150" y2="380" stroke-dasharray="4 6" />
    <line x1="350" y1="0" x2="350" y2="380" stroke-dasharray="4 6" />
    <line x1="550" y1="0" x2="550" y2="380" stroke-dasharray="4 6" />
    <line x1="750" y1="0" x2="750" y2="380" stroke-dasharray="4 6" />
    <line x1="950" y1="0" x2="950" y2="380" stroke-dasharray="4 6" />
    <line x1="1100" y1="0" x2="1100" y2="380" stroke-dasharray="4 6" />
  </g>

  <!-- Left Side: Vector Space Clustering Visual (Dynamic Node Constellation) -->
  <g class="float-group-1">
    <!-- Concentric Distance Metric Rings -->
    <circle cx="180" cy="190" r="130" fill="none" stroke="#4f46e5" stroke-width="1" opacity="0.15" />
    <circle cx="180" cy="190" r="90" fill="none" stroke="#6366f1" stroke-width="1.2" class="pulse-1" stroke-dasharray="6 4" />
    <circle cx="180" cy="190" r="50" fill="none" stroke="#06b6d4" stroke-width="1.5" opacity="0.35" />

    <!-- Vector Similarity Edges (Graph / HNSW topology) -->
    <g class="anim-flow" stroke="#818cf8" stroke-width="1.2" opacity="0.45">
      <line x1="180" y1="190" x2="120" y2="140" />
      <line x1="180" y1="190" x2="230" y2="120" />
      <line x1="180" y1="190" x2="240" y2="240" />
      <line x1="180" y1="190" x2="110" y2="235" />
      <line x1="120" y1="140" x2="75" y2="185" />
      <line x1="230" y1="120" x2="285" y2="165" />
      <line x1="240" y1="240" x2="270" y2="280" />
      <line x1="110" y1="235" x2="65" y2="255" />
    </g>

    <!-- Embedding Vector Centroids & Points -->
    <circle cx="180" cy="190" r="6" fill="#38bdf8" filter="url(#neon-glow)" />
    <circle cx="120" cy="140" r="4.5" fill="#818cf8" class="node-p1" />
    <circle cx="230" cy="120" r="4" fill="#a78bfa" class="node-p2" />
    <circle cx="240" cy="240" r="5" fill="#34d399" class="node-p3" />
    <circle cx="110" cy="235" r="4" fill="#38bdf8" class="node-p2" />
    <circle cx="75" cy="185" r="3" fill="#93c5fd" class="node-p1" />
    <circle cx="285" cy="165" r="3.5" fill="#67e8f9" class="node-p3" />
    <circle cx="270" cy="280" r="3" fill="#a7f3d0" class="node-p1" />
    <circle cx="65" cy="255" r="2.5" fill="#c4b5fd" class="node-p2" />
  </g>

  <!-- Right Side: High-Dimensional Cosine Nearest Neighbor Radar -->
  <g class="float-group-2">
    <circle cx="1020" cy="190" r="140" fill="none" stroke="#0ea5e9" stroke-width="1" opacity="0.15" />
    <circle cx="1020" cy="190" r="95" fill="none" stroke="#38bdf8" stroke-width="1.2" class="pulse-2" stroke-dasharray="5 5" />
    <circle cx="1020" cy="190" r="50" fill="none" stroke="#6366f1" stroke-width="1.5" opacity="0.3" />

    <!-- Radar Line Sweep -->
    <g class="sweep-arm">
      <line x1="1020" y1="190" x2="1140" y2="190" stroke="url(#title-grad)" stroke-width="2" opacity="0.6" />
    </g>

    <!-- Dimension Vector Points -->
    <g class="anim-flow" stroke="#38bdf8" stroke-width="1" opacity="0.4">
      <line x1="1020" y1="190" x2="960" y2="130" />
      <line x1="1020" y1="190" x2="1080" y2="140" />
      <line x1="1020" y1="190" x2="1090" y2="245" />
      <line x1="1020" y1="190" x2="945" y2="240" />
      <line x1="960" y1="130" x2="890" y2="160" />
      <line x1="1080" y1="140" x2="1135" y2="130" />
    </g>
    <circle cx="1020" cy="190" r="6" fill="#6366f1" filter="url(#neon-glow)" />
    <circle cx="960" cy="130" r="4.5" fill="#38bdf8" class="node-p2" />
    <circle cx="1080" cy="140" r="4" fill="#34d399" class="node-p3" />
    <circle cx="1090" cy="245" r="4.5" fill="#818cf8" class="node-p1" />
    <circle cx="945" cy="240" r="3.5" fill="#a78bfa" class="node-p2" />
    <circle cx="890" cy="160" r="3" fill="#67e8f9" class="node-p3" />
    <circle cx="1135" cy="130" r="3" fill="#c4b5fd" class="node-p1" />
  </g>

  <!-- Center Floating Tag Badges (Background context - does not obscure main text) -->
  <g class="float-group-1" opacity="0.85">
    <!-- Top Pill: AI Ecosystem -->
    <g transform="translate(485, 36)">
      <rect width="230" height="28" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="1" opacity="0.8" />
      <circle cx="16" cy="14" r="4" fill="#10b981" filter="url(#neon-glow)" />
      <text x="28" y="18" class="pill-text" fill="#93c5fd">⚡ AI-NATIVE DATA ECOSYSTEM</text>
    </g>
  </g>

  <!-- FOREGROUND TEXT SECTION (High z-index, crisp contrast, immune to overlaps) -->
  <g filter="url(#subtle-shadow)">
    <!-- Main Headline -->
    <text x="600" y="132" text-anchor="middle" class="main-title" font-size="44" fill="#ffffff" letter-spacing="-0.5">
      AWESOME <tspan fill="url(#title-grad)">VECTOR DATABASE</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="600" y="174" text-anchor="middle" class="subtitle" font-size="16.5" fill="#94a3b8">
      Curated Directory of Vector Databases, ANN Indexes, Embedding Stores &amp; RAG Backends
    </text>

    <!-- Description Line -->
    <text x="600" y="208" text-anchor="middle" class="subtitle" font-size="13.5" fill="#cbd5e1" opacity="0.85">
      The Core Memory &amp; Similarity Search Layer for Generative AI, LLM Agents &amp; Semantic Retrieval
    </text>
  </g>

  <!-- Lower Architecture Pills (Foreground, neatly arranged) -->
  <g transform="translate(260, 260)">
    <!-- Pill 1: Embeddings -->
    <g transform="translate(0, 0)">
      <rect width="145" height="36" rx="18" fill="#111c35" stroke="#4f46e5" stroke-width="1.2" />
      <text x="72" y="22" text-anchor="middle" class="pill-text" fill="#a5b4fc">🧠 Embeddings</text>
    </g>

    <!-- Pill 2: ANN Search -->
    <g transform="translate(160, 0)">
      <rect width="155" height="36" rx="18" fill="#0f2634" stroke="#0ea5e9" stroke-width="1.2" />
      <text x="77" y="22" text-anchor="middle" class="pill-text" fill="#7dd3fc">⚡ ANN Indexing</text>
    </g>

    <!-- Pill 3: RAG Ready -->
    <g transform="translate(330, 0)">
      <rect width="150" height="36" rx="18" fill="#0e2825" stroke="#10b981" stroke-width="1.2" />
      <text x="75" y="22" text-anchor="middle" class="pill-text" fill="#6ee7b7">🔍 RAG Backends</text>
    </g>

    <!-- Pill 4: Hybrid Search -->
    <g transform="translate(495, 0)">
      <rect width="180" height="36" rx="18" fill="#24143a" stroke="#a855f7" stroke-width="1.2" />
      <text x="90" y="22" text-anchor="middle" class="pill-text" fill="#d8b4fe">🌐 Hybrid &amp; Multimodal</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="350" y="335" width="500" height="2" rx="1" fill="url(#title-grad)" opacity="0.6" />
</svg>
